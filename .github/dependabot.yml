version: 2
updates:
  # Every action here is pinned by full commit SHA, which means nothing updates
  # them unless something proposes the update. Without this file the pins simply
  # aged: the repository looked immutable and was in fact unmaintained.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
