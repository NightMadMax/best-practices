name: governance-audit

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: NightMadMax/new-project-rules
          # Refreshed 2026-08-03. The previous pin predated the fix that stopped
          # this audit reporting a bypass check it had never performed, so every
          # nightly run printed a reassurance about this repository that nothing
          # had verified. npr-pin-watch.yml now reports the pin going stale.
          ref: a6c4538ee38fdbe4fd1007ae66efa98aa3479a0c
          path: .external/new-project-rules
          persist-credentials: false
      - name: Verify ruleset and sole owner-admin invariant
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .external/new-project-rules/scripts/check_github_governance.py
          --repository NightMadMax/best-practices
          --github-token-scope
